<!doctype html>
<html lang="en">

<head>
    <!-- Meta tags técnicos -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />

    <!-- SEO Meta Tags -->
    <title>Authentic Web Studio | Professional Web Design & Photography</title>
    <meta name="description"
        content="Professional web design and photography studio. We create modern websites and capture authentic moments. Responsive web design, frontend development, and artistic photography in Australia." />
    <meta name="keywords"
        content="web design, web development, professional photography, graphic design, responsive websites, frontend development, artistic photography, branding, visual identity, UX UI design, Australia, Sydney, Melbourne" />
    <meta name="author" content="Authentic Web Studio" />
    <meta name="language" content="English" />
    <meta name="geo.region" content="AU" />
    <meta name="geo.placename" content="Australia" />
    <meta name="revisit-after" content="7 days" />
    <meta name="distribution" content="global" />
    <meta name="rating" content="general" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://authenticwebstudio.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Authentic Web Studio | Professional Web Design & Photography" />
    <meta property="og:description"
        content="Professional web design and photography studio. We create modern websites and capture authentic moments. Responsive web design, frontend development, and artistic photography." />
    <meta property="og:image" content="https://authenticwebstudio.com/img/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://authenticwebstudio.com/img/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Authentic Web Studio - Professional Web Design & Photography" />
    <meta property="og:url" content="https://authenticwebstudio.com" />
    <meta property="og:site_name" content="Authentic Web Studio" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Authentic Web Studio | Professional Web Design & Photography" />
    <meta name="twitter:description"
        content="Professional web design and photography studio. We create modern websites and capture authentic moments." />
    <meta name="twitter:image" content="https://authenticwebstudio.com/img/og-image.jpg" />
    <meta name="twitter:image:alt" content="Authentic Web Studio - Professional Web Design & Photography" />
    <meta name="twitter:site" content="@authenticwebstudio" />
    <meta name="twitter:creator" content="@authenticwebstudio" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <!-- Preconnect para optimización -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts loaded in parallel (non render-blocking) with swap fallback -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" />

    <!-- Preload the loader mark so it paints instantly -->
    <link rel="preload" as="image" href="/img/favicon1.png" />

    <!-- Critical loader styles: paints before the JS bundle loads (no FOUC) -->
    <style>
        #initial-loader {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #15181a;
        }

        #initial-loader img {
            height: 3rem;
            width: auto;
            filter: brightness(0) invert(1);
            animation: initial-loader-pulse 2.6s ease-in-out infinite;
        }

        @keyframes initial-loader-pulse {
            0% { opacity: 0; transform: scale(0.95); }
            25% { opacity: 1; transform: translateY(-3px) scale(1); }
            60% { opacity: 0.82; transform: translateY(0) scale(1); }
            100% { opacity: 1; transform: translateY(-3px) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            #initial-loader img {
                animation: none;
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Static loader shown until React mounts <AppLoader />, which removes it -->
    <div id="initial-loader" aria-hidden="true">
        <img src="/img/favicon1.png" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
